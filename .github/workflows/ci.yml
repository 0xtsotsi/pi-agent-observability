name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint || echo "no lint configured yet"
      - run: yarn format:check || echo "no format:check yet"
      - run: ./node_modules/.bin/tsc --noEmit
      - run: yarn test
